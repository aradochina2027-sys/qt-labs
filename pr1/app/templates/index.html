<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            width: 300px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .result-card {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 350px;
            background-color: #f9f9f9;
        }
        .error-message {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Погода</h1>

    <div class="form-group">
        <input type="text" id="cityInput" placeholder="Введіть місто...">
        <button onclick="fetchWeather()">Показати</button>
    </div>

    <div id="weatherResult"></div>

    <script>
        async function fetchWeather() {
            const city = document.getElementById('cityInput').value;
            const resultDiv = document.getElementById('weatherResult');
            resultDiv.innerHTML = '';

            if (!city.trim()) {
                resultDiv.innerHTML = '<p class="error-message">Будь ласка, введіть назву міста.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result-card">
                            <h3>${data.city}</h3>
                            <p><strong>Температура:</strong> ${data.temperature} °C</p>
                            <p><strong>Швидкість вітру:</strong> ${data.windspeed} м/с</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error-message">${data.detail || 'Сталася помилка'}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = '<p class="error-message">Не вдалося з’єднатися із сервером.</p>';
            }
        }
    </script>

</body>
</html>
